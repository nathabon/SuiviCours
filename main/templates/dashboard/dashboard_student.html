{% extends 'base.html' %}

{% block content %}

<h1>Dashboard élève</h1>
<b>{{ student.first_name }}</b>

<h2>Cours avec {{ student.first_name }}</h2>
<ul>
    {% for lesson in student.lessons.all %}
    <li><a href="{% url 'dashboard-lesson' lesson.date_formated %}">{{ lesson.date }}</a></li>
    {% endfor %}
</ul>

<p>Voir le lien public <a href="{% url 'dashboard-parent-student' student.uuid %}">ici</a></p>

{% endblock %}
